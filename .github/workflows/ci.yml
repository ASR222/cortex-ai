name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    name: Go services
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    services:
      mongo:
        image: mongo:8
        ports: ["27017:27017"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: backend/go.mod, cache-dependency-path: backend/go.sum }
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - name: Unit + integration tests (with race detector)
        run: go test -race -tags integration ./...
        env:
          MONGODB_TEST_URI: mongodb://localhost:27017

  agent:
    name: Python agent
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: agent } }
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  deploy:
    name: Deploy to Cloud Run
    # Only after every check passes, only for pushes to main, one at a time.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [go, agent, frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # lets GitHub mint an OIDC token for Workload Identity Federation
    concurrency: { group: deploy-production, cancel-in-progress: false }
    steps:
      - uses: actions/checkout@v4
      - name: Read deploy/gcp/config.env
        id: cfg
        run: |
          set -a; source deploy/gcp/config.env; set +a
          if [ -z "$PROJECT_ID" ] || [ -z "$PROJECT_NUMBER" ]; then
            echo "::notice::deploy/gcp/config.env is not filled in yet; skipping deploy."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "enabled=true" >> "$GITHUB_OUTPUT"
          echo "provider=projects/$PROJECT_NUMBER/locations/global/workloadIdentityPools/github/providers/github-oidc" >> "$GITHUB_OUTPUT"
          echo "service_account=cortex-deployer@$PROJECT_ID.iam.gserviceaccount.com" >> "$GITHUB_OUTPUT"
      - name: Authenticate to Google Cloud (keyless)
        if: steps.cfg.outputs.enabled == 'true'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ steps.cfg.outputs.provider }}
          service_account: ${{ steps.cfg.outputs.service_account }}
      - if: steps.cfg.outputs.enabled == 'true'
        uses: google-github-actions/setup-gcloud@v2
      - name: Build, push and deploy
        if: steps.cfg.outputs.enabled == 'true'
        run: TAG="${GITHUB_SHA::7}" bash deploy/gcp/deploy.sh

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    needs: [go, agent, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build all images
        run: |
          cp .env.example .env
          sed -i 's/^INTERNAL_TOKEN=.*/INTERNAL_TOKEN=ci/; s/^MONGO_PASSWORD=.*/MONGO_PASSWORD=ci/; s/^REDIS_PASSWORD=.*/REDIS_PASSWORD=ci/; s/^QDRANT_API_KEY=.*/QDRANT_API_KEY=ci/; s/^FIREBASE_PROJECT_ID=.*/FIREBASE_PROJECT_ID=ci/; s/^GROQ_API_KEY=.*/GROQ_API_KEY=ci/; s/^RAZORPAY_KEY_ID=.*/RAZORPAY_KEY_ID=ci/; s/^RAZORPAY_KEY_SECRET=.*/RAZORPAY_KEY_SECRET=ci/' .env
          docker compose build
