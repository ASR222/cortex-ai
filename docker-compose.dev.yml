# Development override: exposes the databases on localhost so you can run the
# Go services, the Python agent and Vite directly on your machine.
#
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d mongo redis qdrant
#
# Never use this file on a server: it publishes database ports.
services:
  mongo:
    ports: ["127.0.0.1:27017:27017"]
  redis:
    ports: ["127.0.0.1:6379:6379"]
  qdrant:
    ports: ["127.0.0.1:6333:6333"]
