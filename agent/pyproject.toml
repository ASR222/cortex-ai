[project]
name = "cortex-agent"
version = "0.1.0"
description = "CortexAI agent service: LangGraph multi-agent orchestration"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.43.105",
    "fastapi>=0.142.2",
    "google-genai>=2.25.0",
    "httpx>=0.28.1",
    "langchain-core>=1.6.6",
    "langchain-google-genai>=4.4.0",
    "langchain-groq>=1.1.3",
    "langchain-openai>=1.6.7",
    "langchain-text-splitters>=1.1.2",
    "langgraph>=1.2.12",
    "pydantic-settings>=2.15.0",
    "pypdf>=6.19.0",
    "python-multipart>=0.0.32",
    "python-pptx>=1.0.2",
    "qdrant-client>=1.19.1",
    "redis>=5",
    "reportlab>=5.0.1",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "fakeredis>=2.38.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.9",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "RUF100"]
ignore = ["B008"]  # FastAPI declares params with Form()/File() defaults

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
