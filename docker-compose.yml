# CortexAI — the whole stack in one command:
#
#   cp .env.example .env    # then fill it in
#   docker compose up -d --build
#
# Only the "web" service (Caddy) publishes ports. Every other service is
# reachable only on the private Docker network, and additionally requires the
# INTERNAL_TOKEN on every request.

x-go-service: &go-service
  restart: unless-stopped
  healthcheck:
    test: ["CMD", "/app", "healthcheck"]
    interval: 15s
    timeout: 3s
    retries: 5

x-common-env: &common-env
  INTERNAL_TOKEN: ${INTERNAL_TOKEN:?set INTERNAL_TOKEN in .env}
  MONGODB_URI: mongodb://${MONGO_USER:-cortex}:${MONGO_PASSWORD:?set MONGO_PASSWORD in .env}@mongo:27017/?authSource=admin
  MONGODB_DB: cortexai

services:
  web:
    build:
      context: ./frontend
      args:
        VITE_FIREBASE_API_KEY: ${VITE_FIREBASE_API_KEY}
        VITE_FIREBASE_AUTH_DOMAIN: ${VITE_FIREBASE_AUTH_DOMAIN}
        VITE_FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID}
        VITE_FIREBASE_APP_ID: ${VITE_FIREBASE_APP_ID}
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-http://localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      gateway:
        condition: service_healthy

  gateway:
    <<: *go-service
    build: { context: ./backend, args: { SERVICE: gateway } }
    environment:
      INTERNAL_TOKEN: ${INTERNAL_TOKEN}
      REDIS_URL: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}@redis:6379/0
      AUTH_SERVICE_URL: http://auth:8081
      CHAT_SERVICE_URL: http://chat:8082
      BILLING_SERVICE_URL: http://billing:8083
      AGENT_SERVICE_URL: http://agent:8084
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      TRUST_PROXY: "true"
    depends_on:
      redis: { condition: service_healthy }
      auth: { condition: service_healthy }
      chat: { condition: service_healthy }
      billing: { condition: service_healthy }
      agent: { condition: service_healthy }

  auth:
    <<: *go-service
    build: { context: ./backend, args: { SERVICE: auth } }
    environment:
      <<: *common-env
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:?set FIREBASE_PROJECT_ID in .env}
      STARTING_CREDITS: ${STARTING_CREDITS:-50}
    depends_on:
      mongo: { condition: service_healthy }

  chat:
    <<: *go-service
    build: { context: ./backend, args: { SERVICE: chat } }
    environment:
      <<: *common-env
      AGENT_SERVICE_URL: http://agent:8084
    depends_on:
      mongo: { condition: service_healthy }

  billing:
    <<: *go-service
    build: { context: ./backend, args: { SERVICE: billing } }
    environment:
      <<: *common-env
      AUTH_SERVICE_URL: http://auth:8081
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:?set RAZORPAY_KEY_ID in .env}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:?set RAZORPAY_KEY_SECRET in .env}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-}
    depends_on:
      mongo: { condition: service_healthy }

  agent:
    build: ./agent
    restart: unless-stopped
    environment:
      INTERNAL_TOKEN: ${INTERNAL_TOKEN}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      CHAT_SERVICE_URL: http://chat:8082
      AUTH_SERVICE_URL: http://auth:8081
      QDRANT_URL: http://qdrant:6333
      QDRANT_API_KEY: ${QDRANT_API_KEY:?set QDRANT_API_KEY in .env}
      GROQ_API_KEY: ${GROQ_API_KEY:?set GROQ_API_KEY in .env}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      CHAT_MODEL: ${CHAT_MODEL:-groq:openai/gpt-oss-120b}
      CODING_MODEL: ${CODING_MODEL:-groq:openai/gpt-oss-120b}
      DOCUMENTS_MODEL: ${DOCUMENTS_MODEL:-groq:openai/gpt-oss-120b}
      ROUTER_MODEL: ${ROUTER_MODEL:-groq:openai/gpt-oss-20b}
      FALLBACK_MODEL: ${FALLBACK_MODEL:-groq:openai/gpt-oss-20b}
      DAILY_REQUEST_CAP: ${DAILY_REQUEST_CAP:-1500}
      STORAGE_DIR: /data/files
    volumes:
      - files:/data/files
    depends_on:
      redis: { condition: service_healthy }
      qdrant: { condition: service_started }

  mongo:
    image: mongo:8
    restart: unless-stopped
    # A small cache keeps MongoDB comfortable on small VMs.
    command: ["--wiredTigerCacheSizeGB", "0.25"]
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-cortex}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Every key we write has a TTL, so volatile-lru can only evict caches and
    # expiring entries when memory is full.
    command: >
      redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes
      --maxmemory 256mb --maxmemory-policy volatile-lru
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep PONG"]
      interval: 10s
      timeout: 3s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

  qdrant:
    image: qdrant/qdrant:latest
    restart: unless-stopped
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY}
    volumes:
      - qdrant-data:/qdrant/storage

volumes:
  mongo-data:
  redis-data:
  qdrant-data:
  files:
  caddy-data:
  caddy-config:
